name: Deploy Modpack Doctor to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check rules.js
          node --check app.js
          node --check zip-utils.js
          node --check pack-core.js
          node --check lab-ui.js
      - name: Check required static files
        run: |
          test -f index.html
          test -f styles.css
          test -f lab.css
          test -f app.js
          test -f rules.js
          test -f zip-utils.js
          test -f pack-core.js
          test -f lab-ui.js
          grep -q 'id="analyzeBtn"' index.html
          grep -q 'script src="rules.js"' index.html
          grep -q 'script src="app.js"' index.html
          grep -q 'script src="zip-utils.js"' index.html
          grep -q 'script src="pack-core.js"' index.html
          grep -q 'script src="lab-ui.js"' index.html
          grep -q 'href="lab.css"' index.html

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
